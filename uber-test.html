<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uber-test 2</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf6ee; color: #2b2620; margin: 0; padding: 20px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #7a7064; margin: 0 0 18px; line-height: 1.4; }
  a { display: block; background: #fff; border: 1px solid #e8e0d0; border-radius: 14px; padding: 16px; margin-bottom: 12px; color: #2b2620; text-decoration: none; font-weight: 700; font-size: 20px; }
  a span { display: block; font-weight: 400; color: #7a7064; font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Uber-test 2: mål = Elviria</h1>
<p>Tryk på hver knap. Skriv hvilke bogstaver der giver <b>Centro Comercial Elviria</b> som mål i Uber-appen.</p>
<div id="links"></div>
<script>
  var E = { lat: 36.495854, lng: -4.7771567, name: "Centro Comercial Elviria", addr: "Centro Comercial Elviria, 29604 Marbella, Málaga, Spain" };
  var e = encodeURIComponent;
  function d(enc) {
    var L = enc ? "%5B" : "[", R = enc ? "%5D" : "]";
    return "&dropoff" + L + "latitude" + R + "=" + E.lat + "&dropoff" + L + "longitude" + R + "=" + E.lng +
      "&dropoff" + L + "nickname" + R + "=" + e(E.name) + "&dropoff" + L + "formatted_address" + R + "=" + e(E.addr);
  }
  var links = [
    ["E", "uber:// med almindelige klammer", "uber://?action=setPickup&pickup=my_location" + d(false)],
    ["F", "uber:// med kodede klammer", "uber://?action=setPickup&pickup=my_location" + d(true)],
    ["G", "Universal link, kun mål", "https://m.uber.com/ul/?action=setPickup&pickup=my_location" + d(false)]
  ];
  document.getElementById("links").innerHTML = links.map(function (l) {
    return '<a href="' + l[2] + '">' + l[0] + '<span>' + l[1] + '</span></a>';
  }).join("");
</script>
</body>
</html>
