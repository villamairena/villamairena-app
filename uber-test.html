<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uber-test</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf6ee; color: #2b2620; margin: 0; padding: 20px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #7a7064; margin: 0 0 18px; line-height: 1.4; }
  a { display: block; background: #fff; border: 1px solid #e8e0d0; border-radius: 14px; padding: 16px; margin-bottom: 12px; color: #2b2620; text-decoration: none; font-weight: 700; }
  a span { display: block; font-weight: 400; color: #7a7064; font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Uber-test: villa → Elviria</h1>
<p>Tryk på hver knap og se, om Uber viser VillaMairena / Calle Navarra 5 som afhentningssted. Skriv hvilke bogstaver der virker.</p>
<div id="links"></div>
<script>
  var V = { lat: 36.531, lng: -4.754, name: "VillaMairena", addr: "Calle Navarra 5, 29612 Ojén, Málaga, Spain" };
  var E = { lat: 36.5008, lng: -4.7660, name: "Elviria", addr: "Elviria, 29604 Marbella, Málaga, Spain" };
  var e = encodeURIComponent;
  function q(br, p, o) {
    var L = br ? "%5B" : "[", R = br ? "%5D" : "]";
    return "&" + p + L + "latitude" + R + "=" + o.lat + "&" + p + L + "longitude" + R + "=" + o.lng +
      "&" + p + L + "nickname" + R + "=" + e(o.name) + "&" + p + L + "formatted_address" + R + "=" + e(o.addr);
  }
  function j(o) { return e(JSON.stringify({ addressLine1: o.name, addressLine2: o.addr, latitude: o.lat, longitude: o.lng, source: "SEARCH", provider: "uber_places" })); }
  var links = [
    ["A", "Universal link, kodede klammer (det appen bruger nu)", "https://m.uber.com/ul/?action=setPickup" + q(true, "pickup", V) + q(true, "dropoff", E)],
    ["B", "Universal link, almindelige klammer", "https://m.uber.com/ul/?action=setPickup" + q(false, "pickup", V) + q(false, "dropoff", E)],
    ["C", "Direkte i Uber-appen (uber://)", "uber://?action=setPickup" + q(false, "pickup", V) + q(false, "dropoff", E)],
    ["D", "Ubers nye web-format", "https://m.uber.com/looking?pickup=" + j(V) + "&drop%5B0%5D=" + j(E)]
  ];
  document.getElementById("links").innerHTML = links.map(function (l) {
    return '<a href="' + l[2] + '">' + l[0] + '<span>' + l[1] + '</span></a>';
  }).join("");
</script>
</body>
</html>
