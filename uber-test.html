<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uber-test 3</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf6ee; color: #2b2620; margin: 0; padding: 20px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #7a7064; margin: 0 0 18px; line-height: 1.4; }
  a { display: block; background: #fff; border: 1px solid #e8e0d0; border-radius: 14px; padding: 16px; margin-bottom: 12px; color: #2b2620; text-decoration: none; font-weight: 700; font-size: 20px; }
  a span { display: block; font-weight: 400; color: #7a7064; font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<h1>Uber-test 3 (med ID): mål = Elviria</h1>
<p>Test på iPhone i Safari. Tryk på hver knap og skriv hvilke bogstaver der giver <b>Centro Comercial Elviria</b> som mål i Uber-appen.</p>
<div id="links"></div>
<script>
  var ID = "0Rwyz6kkmXXKHYORmcIxNPMdTzoCEmP1";
  var V = { lat: 36.5322322, lng: -4.7508528, name: "VillaMairena", addr: "Calle Navarra 5, 29612 Ojén, Málaga, Spain" };
  var E = { lat: 36.495854, lng: -4.7771567, name: "Centro Comercial Elviria", addr: "Centro Comercial Elviria, 29604 Marbella, Málaga, Spain" };
  var e = encodeURIComponent;
  function q(p, o, enc) {
    var L = enc ? "%5B" : "[", R = enc ? "%5D" : "]";
    return "&" + p + L + "latitude" + R + "=" + o.lat + "&" + p + L + "longitude" + R + "=" + o.lng +
      "&" + p + L + "nickname" + R + "=" + e(o.name) + "&" + p + L + "formatted_address" + R + "=" + e(o.addr);
  }
  var base = "?client_id=" + ID + "&action=setPickup";
  var links = [
    ["H", "Universal link med ID, kun mål", "https://m.uber.com/ul/" + base + "&pickup=my_location" + q("dropoff", E, false)],
    ["I", "Universal link med ID, kodede klammer", "https://m.uber.com/ul/" + base + "&pickup=my_location" + q("dropoff", E, true)],
    ["J", "uber:// med ID, kun mål", "uber://" + base + "&pickup=my_location" + q("dropoff", E, false)],
    ["K", "Universal link med ID, villa + mål", "https://m.uber.com/ul/" + base + q("pickup", V, false) + q("dropoff", E, false)]
  ];
  document.getElementById("links").innerHTML = links.map(function (l) {
    return '<a href="' + l[2] + '">' + l[0] + '<span>' + l[1] + '</span></a>';
  }).join("");
</script>
</body>
</html>
