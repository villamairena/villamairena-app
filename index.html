<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<meta name="description" content="VillaMairena · La Mairena, Ojén">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VillaMairena">
<title>VillaMairena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a phone-width app shell — sticky header, one scrolling panel per tab, bottom tab bar. Brand: VillaMairena gold on cream, pine green as the second voice. */
:root{
  --bg:#f7f2e7; --surface:#fffdf8; --ink:#2b2a24; --muted:#6f6a5b; --line:#e4dccb;
  --gold:#a8812f; --gold-soft:#efe3c4; --pine:#3f5a45; --pine-soft:#e3ebe2;
  --todo:#9a6a1c; --todo-bg:#fbf1dc;
  --sky1:#f3e2bd; --sky2:#f7f2e7; --hill1:#c9b894; --hill2:#8f9c7f; --hill3:#3f5a45;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a16; --surface:#20241f; --ink:#ece6d6; --muted:#a8a28f; --line:#343a32;
  --gold:#d3ad5c; --gold-soft:#3a3222; --pine:#9fbca4; --pine-soft:#26322a;
  --todo:#e6b765; --todo-bg:#33291a;
  --sky1:#3a3222; --sky2:#171a16; --hill1:#4a4535; --hill2:#34402f; --hill3:#22301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a16; --surface:#20241f; --ink:#ece6d6; --muted:#a8a28f; --line:#343a32;
  --gold:#d3ad5c; --gold-soft:#3a3222; --pine:#9fbca4; --pine-soft:#26322a;
  --todo:#e6b765; --todo-bg:#33291a;
  --sky1:#3a3222; --sky2:#171a16; --hill1:#4a4535; --hill2:#34402f; --hill3:#22301f;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:1.6rem;line-height:1.2}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--pine)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.logo{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.02em}
.logo b{font-weight:400;color:var(--gold)}
.lang{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* hero */
.hero{margin-inline:-16px;position:relative}
.hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;max-width:100%}
.hero::after{content:"";position:absolute;inset:25% 0 0 0;background:linear-gradient(to bottom,transparent,rgba(20,26,18,.72));pointer-events:none}
.hero .txt{z-index:1}
.hero .txt{position:absolute;left:16px;right:16px;bottom:16px;color:#f7f2e7;text-shadow:0 1px 10px rgba(20,28,18,.55)}
.hero .txt h1{font-size:2rem;line-height:1.1}
.hero .txt p{opacity:.9;font-size:.9rem}

section.panel{display:grid;gap:18px;padding-block:20px}
.stack{display:grid;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

.key{display:grid;gap:4px}
.key .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.key .val{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}

.todo{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--todo);background:var(--todo-bg);
  border:1px dashed var(--todo);border-radius:8px;padding:2px 8px;width:fit-content}
.todo-block{border:1px dashed var(--todo);background:var(--todo-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.9rem;display:grid;gap:4px}
.todo-block strong{color:var(--todo)}

.wx{display:grid;gap:12px}
.wx-now{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.wx-now svg{width:52px;height:52px;color:var(--gold);grid-row:1/span 2}
.wx-t{font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.wx-d{color:var(--muted);font-size:.9rem}
.wx-meta{display:flex;flex-wrap:wrap;gap:6px}
.wx-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;border-top:1px solid var(--line);padding-top:10px}
.wx-day{display:grid;justify-items:center;gap:2px;font-size:.78rem;font-variant-numeric:tabular-nums}
.wx-day svg{width:22px;height:22px;color:var(--pine)}
.wx-day .dn{color:var(--muted);font-weight:700}
.wx-day .lo{color:var(--muted)}
.wx-note{font-size:.75rem;color:var(--muted)}
.food{display:grid;gap:10px}
.food .acts{display:flex;flex-wrap:wrap;gap:8px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--pine);color:var(--surface);text-decoration:none;font-weight:700;border-radius:99px;padding:10px 16px}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;display:grid;gap:4px}
.note .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.food .btn{grid-row:auto;grid-column:auto}
.row{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center}
.row .ic svg{width:20px;height:20px}
.row .body{min-width:0;display:grid;gap:2px}
.row .body .t{font-weight:700}
.row .body .s{color:var(--muted);font-size:.9rem}

.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;background:var(--pine-soft);color:var(--pine);border-radius:99px;padding:4px 10px;font-weight:600}

.steps{display:grid;gap:0;counter-reset:s;margin:0;padding:16px;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.steps li > div{min-width:0;display:grid;gap:4px}

.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-block:2px 6px}
.gal figure{flex:none;width:78%;max-width:340px;margin:0;scroll-snap-align:start;display:grid;gap:6px}
.gal img,.photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;max-width:100%}
.gal figcaption{font-size:.85rem;color:var(--muted)}
.room .th{width:76px;height:56px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,12,9,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:90%;border-radius:8px}
.room{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.room:first-of-type{border-top:0}
.room .n{font-family:var(--f-display);color:var(--gold)}
.room .m{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.room .d{min-width:0}
.room .d small{display:block;color:var(--muted)}

.pool{display:grid;gap:8px}
.pool svg{width:100%;height:auto;display:block}

details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::after{content:"+";color:var(--gold);font-weight:400;font-size:1.2rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:8px;color:var(--muted)}

.place{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:12px;border-top:1px solid var(--line)}
.place:first-child{border-top:0;padding-top:0}
.place .nm{font-weight:700}
.place .dist{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:.85rem;white-space:nowrap}
.place .ds{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.contact{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.contact:first-child{border-top:0;padding-top:0}
.contact .who{font-weight:700}
.contact .what{color:var(--muted);font-size:.88rem;grid-column:1}
.contact > .todo{grid-column:1}
.contact .num{font-variant-numeric:tabular-nums;user-select:all;grid-column:1}
.btn{font:inherit;font-size:.82rem;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;grid-row:1/span 3;grid-column:2}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,.tabs button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sos{background:var(--pine);color:var(--surface);border:0}
.sos .what,.sos .s{color:inherit;opacity:.85}
.sos .big{font-family:var(--f-display);font-size:2.4rem;line-height:1}

.linkbtn{display:inline-flex;gap:6px;align-items:center;font-weight:700;text-decoration:none;color:var(--pine);border:1px solid var(--line);border-radius:99px;padding:8px 14px;width:fit-content;background:var(--surface)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{font:inherit;font-size:.7rem;font-weight:700;background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 0;cursor:pointer;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.85rem;z-index:20}
@media (prefers-reduced-motion:no-preference){section.panel{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
.lang{appearance:none;-webkit-appearance:none;font:inherit;font-size:.8rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 26px 5px 12px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.lang:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fire{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--todo-bg);border:1px solid var(--todo);border-radius:var(--r);padding:12px 14px;font-size:.88rem;line-height:1.45}
.fire svg{flex:none;width:22px;height:22px;color:var(--todo);margin-top:2px}
.fire strong{color:var(--todo)}
details.how summary{align-items:center;justify-content:flex-start}
details.how summary::after{margin-left:auto}
details.how .hi{width:30px;height:30px;border-radius:8px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;flex:none;margin-right:4px}
details.how .hi svg{width:18px;height:18px}
details.how ul{margin:10px 0 0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
details.how p{margin-top:8px}
details.how:target,details.how[open]{border-color:var(--gold)}
.safety{scroll-margin-top:72px}
.safety h4{font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin:6px 0 0}
.safety ul,.safety ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.92rem}
.safety ol li::marker{color:var(--gold);font-weight:700}
.season{background:var(--todo-bg);border:1px solid var(--todo);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:.92rem}
.season .lbl{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--todo);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
#saadan details{scroll-margin-top:72px}
.tabs button span{display:block}

.golf ol{list-style:none;margin:0;padding:0;counter-reset:g}
.golf li{counter-increment:g;display:grid;grid-template-columns:28px 1fr;column-gap:10px;row-gap:2px;padding-block:12px;border-top:1px solid var(--line)}
.golf li:first-child{border-top:0;padding-top:4px}
.golf li::before{content:counter(g);grid-row:1/span 4;width:24px;height:24px;border-radius:50%;background:var(--pine-soft);color:var(--pine);font-weight:700;font-size:.78rem;display:grid;place-items:center;margin-top:1px}
.golf .gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.golf .gn{font-weight:700}
.golf .gm{color:var(--gold);font-weight:700;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.golf .gs{color:var(--muted);font-size:.86rem;grid-column:2}
.golf .gl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:.85rem;font-weight:700}
.golf .gl a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--pine)}
.golf .gl a:hover{text-decoration:underline}

details.place.golf{display:block;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0}
details.place.golf:first-child{border-top:0;padding-top:0}
details.place.golf summary{display:grid;grid-template-columns:18px 1fr auto;gap:4px 8px;align-items:baseline;cursor:pointer;list-style:none;font-weight:400}
details.place.golf summary::-webkit-details-marker{display:none}
details.place.golf summary::before{content:"";width:0;height:0;border-left:7px solid var(--gold);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s;align-self:center;grid-row:1}
details.place.golf[open] summary::before{transform:rotate(90deg)}
details.place.golf summary::after{content:none}
details.place.golf summary .nm{font-weight:700}
details.place.golf summary .ds{grid-column:2/-1}
details.place.golf .gi{font-size:.85rem;margin:10px 0 0 26px}
details.place.golf ol{margin:6px 0 0 26px}
details.place.golf li{grid-template-columns:24px 1fr}
details.place.golf li::before{width:20px;height:20px;font-size:.72rem}

.logo{display:block;line-height:0}
.logo img{height:30px;width:auto;max-width:60vw}
.lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:block}}
:root[data-theme="dark"] .lg-light{display:none}
:root[data-theme="dark"] .lg-dark{display:block}

</style>
</head>
